name: RAMS Admin Password Setup

on:
  workflow_dispatch:

jobs:
  set-admin-password:
    name: Set RAMS admin password
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.RAMS_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.RAMS_JWT_SECRET_KEY }}
      RAMS_ADMIN_USERNAME: ${{ secrets.RAMS_ADMIN_USERNAME }}
      RAMS_ADMIN_PASSWORD: ${{ secrets.RAMS_ADMIN_PASSWORD }}
      RAMS_ADMIN_FULL_NAME: ${{ secrets.RAMS_ADMIN_FULL_NAME }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check secrets are configured
        run: |
          test -n "$DATABASE_URL" || { echo "RAMS_DATABASE_URL is not configured."; exit 1; }
          test -n "$JWT_SECRET_KEY" || { echo "RAMS_JWT_SECRET_KEY is not configured."; exit 1; }
          test -n "$RAMS_ADMIN_USERNAME" || { echo "RAMS_ADMIN_USERNAME is not configured."; exit 1; }
          test -n "$RAMS_ADMIN_PASSWORD" || { echo "RAMS_ADMIN_PASSWORD is not configured."; exit 1; }

      - name: Create or update admin user
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from app.core.security import hash_password

          username = os.environ["RAMS_ADMIN_USERNAME"].strip()
          password = os.environ["RAMS_ADMIN_PASSWORD"]
          full_name = (os.environ.get("RAMS_ADMIN_FULL_NAME") or username).strip() or username
          database_url = os.environ["DATABASE_URL"]

          if not username:
              raise SystemExit("RAMS_ADMIN_USERNAME is empty")
          if not (8 <= len(password) <= 72):
              raise SystemExit("RAMS_ADMIN_PASSWORD must be 8-72 characters")

          engine = create_engine(database_url, pool_pre_ping=True)
          password_hash = hash_password(password)

          with engine.begin() as conn:
              conn.execute(text("CREATE SCHEMA IF NOT EXISTS rams"))
              conn.execute(text("""
                  CREATE TABLE IF NOT EXISTS rams.organizations (
                      organization_id BIGSERIAL PRIMARY KEY,
                      name VARCHAR(200) NOT NULL,
                      code VARCHAR(50) UNIQUE,
                      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
                  )
              """))
              conn.execute(text("""
                  CREATE TABLE IF NOT EXISTS rams.users (
                      user_id BIGSERIAL PRIMARY KEY,
                      organization_id BIGINT
                          REFERENCES rams.organizations(organization_id)
                          ON DELETE SET NULL,
                      username VARCHAR(100) NOT NULL UNIQUE,
                      full_name VARCHAR(200) NOT NULL,
                      email VARCHAR(255) UNIQUE,
                      role VARCHAR(50) NOT NULL DEFAULT 'inspector',
                      is_active BOOLEAN NOT NULL DEFAULT TRUE,
                      password_hash VARCHAR(255),
                      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
                  )
              """))
              conn.execute(text("""
                  CREATE INDEX IF NOT EXISTS idx_users_username
                  ON rams.users (username)
              """))

              existing = conn.execute(
                  text("SELECT user_id FROM rams.users WHERE username = :username"),
                  {"username": username},
              ).first()

              if existing is None:
                  conn.execute(
                      text("""
                          INSERT INTO rams.users (
                              username, full_name, email, role, is_active, password_hash
                          ) VALUES (
                              :username, :full_name, NULL, 'admin', TRUE, :password_hash
                          )
                      """),
                      {
                          "username": username,
                          "full_name": full_name,
                          "password_hash": password_hash,
                      },
                  )
                  action = "created"
              else:
                  conn.execute(
                      text("""
                          UPDATE rams.users
                          SET password_hash = :password_hash,
                              is_active = TRUE,
                              role = 'admin',
                              full_name = :full_name
                          WHERE username = :username
                      """),
                      {
                          "username": username,
                          "full_name": full_name,
                          "password_hash": password_hash,
                      },
                  )
                  action = "updated"

          print(f"Admin user {action}: {username}")
          PY
