name: RAMS Admin Password Setup

on:
  workflow_dispatch:

jobs:
  set-admin-password:
    name: Set RAMS admin password
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.RAMS_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.RAMS_JWT_SECRET_KEY }}
      RAMS_ADMIN_USERNAME: ${{ secrets.RAMS_ADMIN_USERNAME }}
      RAMS_ADMIN_PASSWORD: ${{ secrets.RAMS_ADMIN_PASSWORD }}
      RAMS_ADMIN_FULL_NAME: ${{ secrets.RAMS_ADMIN_FULL_NAME }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check secrets are configured
        run: |
          test -n "$DATABASE_URL" || { echo "RAMS_DATABASE_URL is not configured."; exit 1; }
          test -n "$JWT_SECRET_KEY" || { echo "RAMS_JWT_SECRET_KEY is not configured."; exit 1; }
          test -n "$RAMS_ADMIN_USERNAME" || { echo "RAMS_ADMIN_USERNAME is not configured."; exit 1; }
          test -n "$RAMS_ADMIN_PASSWORD" || { echo "RAMS_ADMIN_PASSWORD is not configured."; exit 1; }

      - name: Create or update admin user
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import select
          from app.core.security import hash_password
          from app.db.session import SessionLocal
          from app.models.user import User

          username = os.environ["RAMS_ADMIN_USERNAME"].strip()
          password = os.environ["RAMS_ADMIN_PASSWORD"]
          full_name = (os.environ.get("RAMS_ADMIN_FULL_NAME") or username).strip()

          if not username:
              raise SystemExit("RAMS_ADMIN_USERNAME is empty")
          if not (8 <= len(password) <= 72):
              raise SystemExit("RAMS_ADMIN_PASSWORD must be 8-72 characters")

          with SessionLocal() as db:
              user = db.scalar(select(User).where(User.username == username))
              if user is None:
                  user = User(
                      username=username,
                      full_name=full_name,
                      email=None,
                      role="admin",
                      is_active=True,
                      password_hash=hash_password(password),
                  )
                  db.add(user)
                  action = "created"
              else:
                  user.password_hash = hash_password(password)
                  user.is_active = True
                  user.role = "admin"
                  if full_name:
                      user.full_name = full_name
                  action = "updated"
              db.commit()

          print(f"Admin user {action}: {username}")
          PY
