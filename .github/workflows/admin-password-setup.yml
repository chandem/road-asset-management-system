name: RAMS Admin Password Setup

on:
  workflow_dispatch:

jobs:
  set-admin-password:
    name: Set RAMS admin password
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.RAMS_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.RAMS_JWT_SECRET_KEY }}
      RAMS_ADMIN_USERNAME: ${{ secrets.RAMS_ADMIN_USERNAME }}
      RAMS_ADMIN_PASSWORD: ${{ secrets.RAMS_ADMIN_PASSWORD }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check secrets are configured
        run: |
          test -n "$DATABASE_URL" || { echo "RAMS_DATABASE_URL is not configured."; exit 1; }
          test -n "$JWT_SECRET_KEY" || { echo "RAMS_JWT_SECRET_KEY is not configured."; exit 1; }
          test -n "$RAMS_ADMIN_USERNAME" || { echo "RAMS_ADMIN_USERNAME is not configured."; exit 1; }
          test -n "$RAMS_ADMIN_PASSWORD" || { echo "RAMS_ADMIN_PASSWORD is not configured."; exit 1; }

      - name: Set admin password
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import select
          from app.core.security import hash_password
          from app.db.session import SessionLocal
          from app.models.user import User

          username = os.environ["RAMS_ADMIN_USERNAME"]
          password = os.environ["RAMS_ADMIN_PASSWORD"]

          with SessionLocal() as db:
              user = db.scalar(select(User).where(User.username == username))
              if user is None:
                  raise SystemExit(f"User '{username}' was not found. Create the user first.")
              user.password_hash = hash_password(password)
              user.is_active = True
              if user.role != "admin":
                  user.role = "admin"
              db.commit()

          print(f"Admin password configured for user: {username}")
          PY
