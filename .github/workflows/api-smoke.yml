name: RAMS API Smoke

on:
  workflow_dispatch:
  schedule:
    # Daily light check (UTC)
    - cron: "0 6 * * *"

jobs:
  smoke:
    name: Smoke test live API
    runs-on: ubuntu-latest
    env:
      API_BASE: ${{ secrets.RAMS_API_BASE_URL }}
      ADMIN_USER: ${{ secrets.RAMS_ADMIN_USERNAME }}
      ADMIN_PASS: ${{ secrets.RAMS_ADMIN_PASSWORD }}
    steps:
      - name: Resolve API base
        run: |
          if [ -z "$API_BASE" ]; then
            echo "API_BASE=https://rams-backend-3zlb.onrender.com" >> "$GITHUB_ENV"
            echo "Using default Render backend URL"
          else
            echo "API_BASE=$API_BASE" >> "$GITHUB_ENV"
          fi

      - name: Health and OpenAPI
        run: |
          set -euo pipefail
          echo "Checking $API_BASE/health"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$API_BASE/health" || true)
          if [ "$code" != "200" ]; then
            # Some deployments only expose /docs — try that
            code=$(curl -sS -o /tmp/docs.html -w "%{http_code}" "$API_BASE/docs" || true)
            if [ "$code" != "200" ]; then
              echo "Health/docs failed with HTTP $code"
              exit 1
            fi
            echo "docs OK"
          else
            echo "health OK: $(cat /tmp/health.json | head -c 200)"
          fi

          code=$(curl -sS -o /tmp/openapi.json -w "%{http_code}" "$API_BASE/openapi.json" || true)
          if [ "$code" = "200" ]; then
            echo "openapi.json OK"
            python3 - <<'PY'
          import json
          data = json.load(open("/tmp/openapi.json"))
          paths = data.get("paths") or {}
          required = ["/api/v1/roads", "/api/v1/auth/login"]
          missing = [p for p in required if p not in paths]
          # paths may be without prefix depending on mount
          if missing:
              keys = list(paths)[:20]
              print("sample paths", keys)
              # soft check — only warn
              print("Note: some expected paths not listed exactly; continuing")
          else:
              print("Required paths present")
          PY
          else
            echo "openapi.json returned $code (non-fatal if /docs works)"
          fi

      - name: Optional login smoke
        if: ${{ env.ADMIN_USER != '' && env.ADMIN_PASS != '' }}
        run: |
          set -euo pipefail
          body=$(curl -sS -X POST "$API_BASE/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASS\"}")
          echo "$body" | head -c 300
          echo
          echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('access_token'), d; print('login OK')"

          token=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          roads=$(curl -sS -H "Authorization: Bearer $token" "$API_BASE/api/v1/roads")
          echo "$roads" | python3 -c "import sys,json; d=json.load(sys.stdin); assert isinstance(d,list); print(f'roads OK ({len(d)} items)')"
