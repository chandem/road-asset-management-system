name: RAMS Seed Demo Data

on:
  workflow_dispatch:

jobs:
  seed:
    name: Seed demo roads and sections
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.RAMS_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.RAMS_JWT_SECRET_KEY }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check secrets are configured
        run: |
          test -n "$DATABASE_URL" || { echo "RAMS_DATABASE_URL is not configured."; exit 1; }
          test -n "$JWT_SECRET_KEY" || { echo "RAMS_JWT_SECRET_KEY is not configured."; exit 1; }

      - name: Run seed script
        working-directory: backend
        run: python scripts/seed_demo_data.py
